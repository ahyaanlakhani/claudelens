[tool.poetry]
name = "claudelens"
version = "0.1.0"
description = "Skill-collision linter for Claude Code: flags overlapping descriptions, ambiguous triggers, and naming clashes in .claude/skills/."
authors = ["ahyaanlakhani <tahalakhani59@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ahyaanlakhani/claudelens"
repository = "https://github.com/ahyaanlakhani/claudelens"
keywords = ["claude", "claude-code", "skills", "linter", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
packages = [{ include = "claudelens", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.12.0"
rich = "^13.7.0"
pyyaml = "^6.0.1"
# Optional heavy deps. Install via `poetry install --extras semantic`
# or `pip install claudelens[semantic]`.
sentence-transformers = { version = "^3.0.0", optional = true }

[tool.poetry.extras]
semantic = ["sentence-transformers"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.6.0"

[tool.poetry.scripts]
claudelens = "claudelens.cli:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
